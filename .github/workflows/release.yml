name: release

# Sur une étiquette vX.Y.Z : image Docker sur GitHub Container Registry,
# paquets es8core et es8ctl sur PyPI (publication de confiance, à activer
# une fois sur pypi.org pour chaque paquet : workflow release.yml).
on:
  push:
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/es8-cli
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --package es8core --out-dir dist
      # Roue seule : elle embarque web/ et site/, qui sont hors du dossier du paquet.
      - run: uv build --package es8ctl --wheel --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
