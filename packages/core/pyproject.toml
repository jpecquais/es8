[project]
name = "es8core"
version = "0.2.0"
description = "Engine for the BOSS ES-8: bulk format, loop chains, remote reads and verified writes. No dependencies; runs in the browser (Pyodide)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["boss", "es-8", "midi", "sysex", "loop switcher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = []

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]

[project.urls]
Homepage = "https://jpecquais.github.io/es8/"
Repository = "https://github.com/jpecquais/es8"
Issues = "https://github.com/jpecquais/es8/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/es8core"]
