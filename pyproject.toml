# Dépôt es8 : un workspace uv avec le moteur (es8core) et la ligne de commande
# (es8ctl). Les applis web sont dans web/, le site d'accueil dans site/.
[project]
name = "es8-workspace"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["es8core", "es8ctl"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli"]

[tool.uv.sources]
es8core = { workspace = true }
es8ctl = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
